<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#EE3D77">
  <title>CAGnaval</title>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&display=swap">
  <link rel="stylesheet" href="/web/style.css">
  <link rel="preload" as="image" href="/web/img/cag/body.webp" type="image/webp">
</head>
<body>
<main class="app">
  <div class="awning"><span class="plaque"><img class="logo" src="/web/img/logo.png" alt="CAGnaval" width="840" height="178"></span>
    <button class="mute" id="mute" type="button" aria-pressed="false" aria-label="Sound off"><svg viewBox="0 0 24 24" aria-hidden="true"><path class="spk" d="M4 9.5h3.2L11.5 6v12l-4.3-3.5H4z"/><path class="on" d="M14.6 9.2a4 4 0 0 1 0 5.6M17.2 6.8a7.4 7.4 0 0 1 0 10.4"/><path class="off" d="M15 9.5l5 5M20 9.5l-5 5"/></svg></button>
  </div>

  <div class="play">
    <div class="sign score"><span class="kcal"><span id="kcal">0</span><small>kcal</small></span><span class="left" id="left" hidden></span></div>
    <div class="sign next"><span class="cap">next</span><span class="disc" id="nextDisc" role="img"></span></div>
    <p class="status" id="status" role="status"></p>

    <div class="stage" id="stage">
      <div class="jar" id="jar">
        <canvas id="game" tabindex="0" aria-label="Food jar. Left and right arrows aim, space drops the food."></canvas>
        <span class="shine"></span><span class="shine two"></span>
        <canvas class="puppet" id="puppet" aria-hidden="true"></canvas>
        <div class="toast" id="toast" role="status" hidden></div>
      </div>
    </div>

    <div class="powers">
      <button class="pw" id="pwShake" type="button" disabled>
        <span class="ico blue"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9c2.2-3.4 4.4 3.4 6.6 0s4.4 3.4 6.6 0M6.8 16c2.2-3.4 4.4 3.4 6.6 0s4.4 3.4 6.6 0" fill="none" stroke="#fff" stroke-width="2.6" stroke-linecap="round"/></svg></span>
        <span class="txt"><span class="pw-n">Shake</span><span class="pw-d">jolt the jar</span></span>
      </button>
      <button class="pw" id="pwSwap" type="button" disabled>
        <span class="ico pink"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 8.5h13l-3.4-3.4M19 15.5H6l3.4 3.4" fill="none" stroke="#fff" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/></svg></span>
        <span class="txt"><span class="pw-n">Swap</span><span class="pw-d">use next food</span></span>
      </button>
      <button class="pw" id="pwSweep" type="button" disabled>
        <span class="ico yellow"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M10 3.5l1.9 5.1 5.1 1.9-5.1 1.9L10 17.5l-1.9-5.1L3 10.500l5.1-1.9zM18 14l.9 2.3 2.3.9-2.3.9L18 20.400l-.9-2.3-2.3-.9 2.3-.9z" fill="#fff"/></svg></span>
        <span class="txt"><span class="pw-n">Sweep</span><span class="pw-d">clear small ones</span></span>
      </button>
    </div>
  </div>

  <p class="fail" id="fail" hidden>The game could not load. Reload the page to try again.</p>

  <div class="counter">
    <ol class="ladder" id="ladder" aria-label="Food order, smallest to biggest"></ol>
    <p class="note">Practice mode. No tickets, no prizes.</p>
  </div>

  <div class="over" id="home">
    <span class="peekbox" aria-hidden="true"><canvas class="peek" id="peek"></canvas></span>
    <img class="logo big" src="/web/img/logo.png" alt="CAGnaval" width="840" height="178">
    <p class="over-line">Drop food. Merge two of the same.</p>
    <ol class="menu" id="homeMenu" aria-label="Food order, smallest to biggest"></ol>
    <label class="field" for="name"><span class="sr">Your name</span>
      <input id="name" type="text" maxlength="16" autocomplete="nickname" spellcheck="false" placeholder="Your name">
    </label>
    <button class="primary wide" id="play" type="button">Play</button>
    <div class="pair">
      <span class="best">Best <b id="best">0</b> kcal</span>
      <button class="ghost" id="openBoard" type="button">Ranking</button>
    </div>
    <p class="over-line small" id="homeMsg"></p>
  </div>

  <div class="over" id="over" hidden>
    <p class="over-title" id="overTitle"></p>
    <div class="hero"><span class="hero-disc" id="overHero"></span><span class="hero-cap" id="overTop"></span></div>
    <div class="tally">
      <p class="over-kcal"><span id="overKcal">0</span><small>kcal</small></p>
      <p class="sticker" id="overBest" hidden>New best!</p>
    </div>
    <div class="stats">
      <div class="stat blue"><span class="stat-k">Foods</span><span class="stat-v" id="overUsed"></span></div>
      <div class="stat pink"><span class="stat-k">This week</span><span class="stat-v" id="overWeek">–</span></div>
      <div class="stat yellow" id="overGold"><span class="stat-k">Golden</span><span class="stat-v" id="overBonus"></span></div>
    </div>
    <p class="check" id="overCheck"></p>
    <button class="primary wide" id="again" type="button">Play again</button>
    <button class="ghost" id="openBoard2" type="button">Ranking</button>
  </div>

  <div class="over" id="board" hidden>
    <p class="over-title">This week</p>
    <ol class="rank" id="rank"></ol>
    <p class="over-line small" id="rankMsg"></p>
    <button class="ghost" id="closeBoard" type="button">Back</button>
  </div>
</main>

<script src="/shared/detmath.js"></script>
<script src="/shared/matter-det.js"></script>
<script src="/shared/foods.js"></script>
<script src="/shared/sim.js"></script>
<script src="/web/cag-art.js"></script>
<script src="/web/game.js"></script>
</body>
</html>
